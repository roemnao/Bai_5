<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <aside>
            <nav>
                <ul>
                    <li class="icon" style="color: hsl"><img src="image/Menu1.png"></li>
                    <li class="icon"><img src="image/Menu2.png"></li>
                    <li class="icon"><img src="image/Menu3.png"></li>
                    <li class="icon"><img src="image/Menu4.png"></li>
                    <li class="icon"><img src="image/Menu5.png"></li>
                </ul>
            </nav>
        </aside>
        <main class="right">
            <header>
                <div class="left">
                    <h2>Welcome, Amanda</h2>
                    <p class="note">Tue, 07 June 2022</p>
                </div>
                <div class="right horizontal">
                    <div class="search horizontal">
                        <div class="iconl">
                            <img src="image/search.png">
                        </div>
                        
                    
                        <input type="text" placeholder="Search">
                    </div>
                        <div class="icon">
                        <img src="image/noti.png">
                    </div>
                    <img src="image/Avatar1.png" class="avatar" style="height: 52px;">
                    
                </div>
            </header>
            <img class="headBackGround" src="image/Background.png">
            <div class="container">
                <section class="block1">
                    <div class="left horizontal" style="width: 300px">
                        <img class="avatar" src="image/Avatar2.png">
                        <div class="iconPcenter">
                            <p class="mainText">Alexa Rawles</p>
                            <p class="note">alexarawles@gmail.com</p>
                        </div>
                    </div>
                        <button class="right">Edit</button>
                    
                </section>
                <form class="block2">
                    <div>
                        <lable>Full name</lable><br>
                        <input type="text" placeholder="Your First Name">
                    </div>
                    <div>
                        <lable>Nick name</lable><br>
                        <input type="text" placeholder="Your Nick Name">
                    </div>
                    <div>
                        <lable>Gender</lable><br>
                        <select required>
                            <option value="" disabled selected hidden>Your Gender</option>
                            <option>Male</option>
                            <option>Female </option>
                        </select>
                    </div>
                    <div>
                        <lable>Country</lable><br>
                        <select required>
                            <option value="" disabled selected hidden>Your Country</option>
                            <option>Male</option>
                            <option>Female </option>
                        </select>
                    </div>
                    <div>
                        <lable>Language</lable><br>
                        <select required>
                            <option value="" disabled selected hidden>Your Language</option>
                            <option>Male</option>
                            <option>Female </option>
                            <option>Helicoptersexual</option>
                        </select>
                    </div>
                    <div>
                        <lable>Zone</lable><br>
                        <select required>
                            <option value="" disabled selected hidden>Your Time Zone</option>
                            <option>Male</option>
                            <option>Female </option>
                        </select>
                    </div>
                    </form>
                </section>
                <section class="block3">
                    <h3>My email Address</h3>
                    <div class="horizontal">
                        <div class="icon"><img src="image/sms.png"></div>
                    
                        <div class="iconPcenter">
                            <p class="mainText">alexarawles@gmail.com</p>
                           <p class="note">1 month ago</p>
                        </div>
                    </div>
                        <button>+Add Email Address</button>
                    
                    
                </section>
            </div>
        </main>
    </body>
</html>
